<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratagem: Advanced Heuristic Sequencing vs. Tempo in PTCG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <style>
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #cbd5e1; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            display: flex; 
            max-width: 1200px; 
            width: 100%; 
            margin-top: 40px; 
            gap: 60px; 
            padding: 0 20px; 
        }
        .sidebar { 
            width: 250px; 
            position: sticky; 
            top: 40px; 
            height: max-content; 
        }
        .sidebar a { 
            display: block; 
            color: #64748b; 
            text-decoration: none; 
            padding: 8px 0; 
            font-size: 14px; 
            border-left: 2px solid #334155; 
            padding-left: 15px; 
            transition: 0.2s; 
        }
        .sidebar a:hover { 
            color: #38bdf8; 
            border-left-color: #38bdf8; 
        }
        .content { 
            flex: 1; 
            max-width: 800px; 
            padding-bottom: 100px; 
            line-height: 1.8; 
            font-size: 16px; 
        }
        h1, h2, h3, h4 { color: #f8fafc; margin-top: 40px; }
        h1 { font-size: 2.2em; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        h2 { font-size: 1.8em; }
        a { color: #38bdf8; text-decoration: none; }
        pre { background: #1e293b; padding: 20px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155;}
        code { font-family: monospace; background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #38bdf8;}
        pre code { color: inherit; background: transparent; padding: 0; }
        table { width: 100%; border-collapse: collapse; margin: 30px 0; font-size: 14px; }
        th, td { border: 1px solid #334155; padding: 15px; text-align: left; }
        th { background-color: #1e293b; color: #f8fafc; font-weight: 600; }
        blockquote { border-left: 4px solid #38bdf8; padding-left: 20px; margin-left: 0; color: #94a3b8; font-style: italic; }
        .hero { text-align: center; margin-bottom: 60px; padding: 40px 0; border-bottom: 1px solid #334155; }
        .hero h1 { border: none; font-size: 3em; margin-bottom: 15px; background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.2em; color: #94a3b8; }
        .mermaid { display: flex; justify-content: center; background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #334155;}
        
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="toc">
            <h3 style="padding-left: 15px; margin-top:0;">Table of Contents</h3>
        </nav>
        <main class="content">
            <div class="hero">
                <h1>Stratagem-AI</h1>
                <p>Advanced Heuristic Sequencing vs. Tempo in the Pokémon TCG</p>
            </div>
            <div id="paper-content">Loading research paper...</div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        fetch('PAPER.md')
            .then(response => response.text())
            .then(async text => {
                const renderer = new marked.Renderer();
                
                // Override code block rendering to catch Mermaid diagrams
                renderer.code = function(code, lang) {
                    if (lang === 'mermaid') {
                        return '<div class="mermaid">' + code + '</div>';
                    }
                    return marked.Renderer.prototype.code.apply(this, arguments);
                };

                document.getElementById('paper-content').innerHTML = marked.parse(text, { renderer: renderer });
                
                // Apply syntax highlighting to Python code
                hljs.highlightAll();

                // Render the Mermaid flowchart visually
                await mermaid.run({ querySelector: '.mermaid' });

                // Generate dynamic Table of Contents
                const toc = document.getElementById('toc');
                const headers = document.querySelectorAll('#paper-content h1, #paper-content h2, #paper-content h3');
                headers.forEach((h, i) => {
                    h.id = 'header-' + i;
                    const a = document.createElement('a');
                    a.href = '#' + h.id;
                    a.textContent = h.textContent.replace(/A \d+\./g, '').trim(); // Clean up odd chars if any
                    
                    if (h.tagName === 'H2') a.style.paddingLeft = '15px';
                    if (h.tagName === 'H3') a.style.paddingLeft = '30px';
                    
                    toc.appendChild(a);
                });
            })
            .catch(err => {
                document.getElementById('paper-content').innerHTML = "Error loading the paper.";
                console.error(err);
            });
    </script>
</body>
</html>
